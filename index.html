<style>

{display:flex;gap:6px;align-items:center}.qty button{width:36px;height:36px;border-radius:8px;background:#252525;color:white;border:1px solid #555}.box input,.box textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:11px;border-radius:10px;background:#222;color:white;border:1px solid #555;font-size:16px}.send{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;background:#25D366;font-weight:bold}.close{width:100%;padding:12px;margin-top:12px;background:#252525;color:white;border:1px solid #555;border-radius:10px}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><section class="hero"><div class="small">HAMBURGUESAS • HOT DOGS • TACOS • MÁS</div><h1>🔥 VALHALLA GROUND 🔥</h1><div class="sub">Hecho al Carbón</div></section>

<section class="info">📞 <b>Pedidos:</b> 221 238 5265<br>🕐 <b>Horario:</b> Jueves a sábado 5:00 p.m.–12:00 a.m.; domingo 6:00 p.m.–12:00 a.m.<br>📍 <b>Dirección:</b> 2 Norte #50, Loma Bonita Caleras, 72100 Puebla, Pue.<br><small>* Aderezo extra $15</small></section></div>
<div class="cart"><button id="open">🛒 Ver pedido · <span id="count">0</span> productos · $<span id="total">0</span></button></div><div id="modal" class="modal"><div class="box"><div id="content"></div><button class="close" id="close">Cerrar</button></div></div>
<script>
const P=[
["hamb","🍔","Hamburguesa Tradicional",69,"Carne, tocino, jamón, queso manchego, cebolla caramelizada, jitomate y aderezo."],
["hamb","🍔","Hamburguesa Hawaiana",79,"Carne, tocino, jamón, piña, salchicha, queso manchego, champiñones, cebolla caramelizada, jitomate y aderezo."],
["hamb","🍔","Hamburguesa Especial",95,"Doble carne, tocino, salchicha, jamón, champiñones, queso manchego, cebolla caramelizada, jitomate y aderezo."],
["hamb","🍔","Hamburguesa Mexa",165,"Doble carne, tocino, salchicha, longaniza, guacamole, lechuga y cebolla."],
["hot","🌭","Hot Dog",65,"Salchicha, tocino, jamón, champiñones, lechuga, cebolla caramelizada y aderezo."],
["hot","🌭","Hot Dog Hawaiano",80,"Salchicha, tocineta, piña, queso y los complementos del hot dog."],
["alitas","🍗","Alitas al carbón · 8 piezas",69,"Piña habanero, mango habanero, ranch, salsa macha, BBQ, ajo parmesano, buffalo o habanero tatemado. Incluye complementos."],
["tacos","🌮","Tacos de asada y longaniza",22,"Orden de tacos de asada y longaniza."],
["tacos","🌮","Tacos combinados",25,"Combinación de asada y longaniza."],
["tacos","🫓","Mulitas",45,"Mulitas preparadas con carne y queso."],
["extras","🍟","Papas a la francesa chicas",50,"Orden de papas a la francesa."],
["extras","🍟","Papas a la francesa grandes",70,"Orden grande de papas a la francesa."],
["extras","🍟","Salchipapas grandes",95,"Papas, salchichas, queso, catsup y mayonesa."],
["extras","🥫","Aderezo extra",15,"Aderezo adicional."],
["esp","🧀","Nachos",100,"Totopos, frijoles, queso amarillo, carne asada, longaniza, guacamole, salsa y limones."],
["esp","🌭","Choripán",95,"Chorizo argentino, carne, queso y guacamole."]
];
let cart={};
const $=s=>document.querySelector(s), money=n=>n.toLocaleString("es-MX");
function render(cat){$("#products").innerHTML=P.map((x,i)=>x[0]==cat?`<article class="card"><div class="emoji">${x[1]}</div><div class="name">${x[2]}</div><div class="desc">${x[4]}</div><div class="bottom"><span class="price">$${money(x[3])}</span><button class="add" data-add="${i}">+ Agregar</button></div></article>`:"").join("")}
function update(){let n=0,t=0;Object.values(cart).forEach(x=>{n+=x.q;t+=x.q*x[3]});$("#count").textContent=n;$("#total").textContent=money(t)}
function showCart(){let a=Object.entries(cart),h="<h2>🛒 Tu pedido</h2>";if(!a.length)h+="<p>Tu pedido está vacío.</p>";let t=0;a.forEach(([i,x])=>{let s=x.q*x[3];t+=s;h+=`<div class="item"><div><b>${x[2]}</b><br><small>$${money(x[3])} c/u · $${money(s)}</small></div><div class="qty"><button data-m="${i}">−</button><b>${x.q}</b><button data-p="${i}">+</button></div></div>`});if(a.length)h+=`<h2 style="text-align:right;color:#f2c94c">TOTAL: $${money(t)}</h2><input id="name" placeholder="Tu nombre"><input id="address" placeholder="Domicilio / referencia"><textarea id="notes" rows="3" placeholder="Notas del pedido (opcional)"></textarea><button class="send" id="send">📲 Enviar pedido por WhatsApp</button>`;$("#content").innerHTML=h;$("#modal").classList.add("show")}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-cat]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.cat)});
$("#products").onclick=e=>{let b=e.target.closest("[data-add]");if(!b)return;let i=b.dataset.add;cart[i]=cart[i]||Object.assign([],P[i],{q:0});cart[i].q++;update()};
$("#open").onclick=showCart;$("#close").onclick=()=>$("#modal").classList.remove("show");
$("#modal").onclick=e=>{let i=e.target.dataset.m||e.target.dataset.p;if(i!==undefined){if(e.target.dataset.p){cart[i].q++}else{cart[i].q--;if(cart[i].q<=0)delete cart[i]}update();showCart()}if(e.target.id=="send"){let lines=["🔥 PEDIDO VALHALLA GROUND",""];let t=0;Object.values(cart).forEach(x=>{let s=x.q*x[3];t+=s;lines.push(`${x.q} x ${x[2]} — $${money(s)}`)});lines.push("",`TOTAL: $${money(t)}`);let n=$("#name")?.value.trim(),a=$("#address")?.value.trim(),no=$("#notes")?.value.trim();if(n)lines.push(`Nombre: ${n}`);if(a)lines.push(`Domicilio/referencia: ${a}`);if(no)lines.push(`Notas: ${no}`);window.open("https://wa.me/522212385265?text="+encodeURIComponent(lines.join("\n")),"_blank")}};
render("hamb");update();
</script></body></html>
